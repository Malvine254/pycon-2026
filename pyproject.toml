[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycord"
version = "0.1.0"
description = "PyCon Kenya 2026 workshop: building a hybrid AI system with Python, Microsoft Foundry and local models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "azure-identity>=1.17",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pypdf>=4.0"]
dev = ["pytest>=8", "ipykernel>=6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/pycord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
